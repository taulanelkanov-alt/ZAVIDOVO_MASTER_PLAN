<!DOCTYPE html>

<meta charset="UTF-8">

<title>Просмотр</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:sans-serif;user-select:none;-webkit-user-select:none}

  #viewer {
    position: absolute; inset: 0; z-index: 1; display: none;
    overflow: hidden; cursor: grab; background: #000;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    contain: strict;
  }
  #viewer.visible { display: block; }
  #viewer.dragging { cursor: grabbing; }
  #world {
    position: absolute; top: 0; left: 0; 
    width: 0; height: 0;
    transform-origin: 0 0; 
    will-change: transform;
    backface-visibility: hidden;
    background: #000;
  }
  .cw {
    position: absolute; pointer-events: none; 
    contain: layout paint; 
  }
  .cw > img {
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    display: block; border: 0; margin: 0; padding: 0; outline: 0;
    pointer-events: none; -webkit-user-drag: none;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  #diag {
    position: absolute; left: 16px; bottom: 16px; z-index: 1000;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(25,25,25,0.8); color: #fff;
    font-size: 12px; line-height: 1.4; pointer-events: none;
    white-space: pre-wrap; font-weight: 500;
    border-left: 3px solid #3b6ef5; display: none;
  }
  #diag.visible { display: block; }

#viewer{display:block}
#viewer-container { position: fixed; inset: 0; display: block; background: #000; }
#viewer-frame { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }

/* Листание */
#pager-controls{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:16px;
  background:rgba(25,25,25,0.85);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.08);
}
#pager-controls button{
  width:36px;height:36px;border:none;border-radius:10px;
  background:rgba(255,255,255,0.05);color:#eee;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center; transition: all 0.2s;
}
#pager-controls button:hover:not(:disabled){background:rgba(255,255,255,0.15)}
#pager-controls button:disabled{opacity:0.3;cursor:default}
#pager-label{font-size:13px;color:#ccc;min-width:60px;text-align:center;font-weight:500}
</style>
</head>
<body>
<div id="viewer-container">
  <div id="viewer-frame">
    <div id="viewer"><div id="world"></div></div>
    
    <!-- Листание -->
    <div id="pager-controls">
      <button id="prev-btn">◀</button>
      <span id="pager-label">1 / 1</span>
      <button id="next-btn">▶</button>
    </div>
  </div>

function createEngine(opts) {
  const cfg = Object.assign({
    maxConcurrent: 8,      
    tileBudget: 360,       
    prefetch: 1,           
    maxScale: 32,
    minScaleFactor: 0.75,
    quality: Math.min(window.devicePixelRatio || 1, 2),
    baseLayerMax: 4000,    
    bgConcurrent: 3
  }, opts.config || {});

  const chunks  = opts.chunks;
  const COLS    = opts.cols, ROWS = opts.rows;
  const TW      = opts.tileW, TH = opts.tileH;
  const LVLW    = opts.levelW;            
  const NL      = LVLW.length;
  const BASE_Z  = NL - 1;
  const resolve = opts.resolve;           
  const viewer  = opts.viewer, world = opts.world, diagEl = opts.diagEl;

  const worldW = COLS * TW, worldH = ROWS * TH;
  const useBase = NL > 1 && chunks.length <= cfg.baseLayerMax;

  const view = { x: 0, y: 0, scale: 1 };
  let minScale = 0.05;
  let curZ = BASE_Z;
  let raf = 0, diagAt = 0;
  let inflight = 0, loadedCount = 0;
  let destroyed = false;

  const queue = [];            
  const bgQueue = [];          
  const live = new Set();      
  let range = null;            

  function ensureNode(c) {
    if (c.wrapper) return;
    const w = document.createElement('div');
    w.className = 'cw';
    // НАХЛЁСТ 10px
    w.style.left = (c.gx * TW - 10) + 'px';
    w.style.top = (c.gy * TH - 10) + 'px';
    w.style.width = (TW + 20) + 'px';
    w.style.height = (TH + 20) + 'px';
    c.wrapper = w;
    world.appendChild(w);
  }

  function apply() {
    world.style.transform = 'translate3d(' + view.x + 'px,' + view.y + 'px,0) scale(' + view.scale + ')';
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; updateVisible(); });
  }

  function idealLevel() {
    const need = TW * view.scale * cfg.quality;
    for (let i = NL - 1; i >= 0; i--) if (LVLW[i] >= need * 0.8) return i;
    return 0;
  }

  function updateVisible() {
    if (destroyed) return;
    const rect = viewer.getBoundingClientRect();
    const vw = rect.width, vh = rect.height, s = view.scale;
    const left = -view.x / s, top = -view.y / s;
    const right = left + vw / s, bottom = top + vh / s;
    const pf = cfg.prefetch;

    const cMinX = Math.max(0, Math.floor(left / TW));
    const cMaxX = Math.min(COLS - 1, Math.ceil(right / TW) - 1);
    const cMinY = Math.max(0, Math.floor(top / TH));
    const cMaxY = Math.min(ROWS - 1, Math.ceil(bottom / TH) - 1);
    const minX = Math.max(0, cMinX - pf), maxX = Math.min(COLS - 1, cMaxX + pf);
    const minY = Math.max(0, cMinY - pf), maxY = Math.min(ROWS - 1, cMaxY + pf);

    if (range) {
      for (let y = range.minY; y <= range.maxY; y++) {
        if (y >= minY && y <= maxY) {
          for (let x = range.minX; x <= range.maxX; x++) {
            if (x >= minX && x <= maxX) continue;
            hide(y * COLS + x);
          }
        } else {
          for (let x = range.minX; x <= range.maxX; x++) hide(y * COLS + x);
        }
      }
    }
    range = { minX, maxX, minY, maxY };

    const z = curZ;
    const ccx = (left + right) / 2 / TW - 0.5;
    const ccy = (top + bottom) / 2 / TH - 0.5;
    queue.length = 0;
    let shown = 0;

    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = y * COLS + x;
        if (i >= chunks.length) continue;
        const c = chunks[i];
        ensureNode(c);
        if (!c.shown) { c.wrapper.style.display = 'block'; c.shown = true; }
        c.keep = true;
        const core = (x >= cMinX && x <= cMaxX && y >= cMinY && y <= cMaxY);
        c.core = core;
        shown++;

        const dx = x - ccx, dy = y - ccy;
        const pri = dx * dx + dy * dy + (core ? 0 : 4096);

        if (useBase && !c.baseLoaded && c.baseLoading !== true)
          queue.push({ c: c, z: BASE_Z, base: true, pri: pri + (z === BASE_Z ? 0 : 8192) });
        if (!(z === BASE_Z && useBase) && c.detailLvl !== z && c.loading !== z)
          queue.push({ c: c, z: z, base: false, pri: pri });
      }

    pump();
    diagnose(z, shown);

  function hide(i) {
    if (i < 0 || i >= chunks.length) return;
    const c = chunks[i];
    if (c && c.shown) { c.wrapper.style.display = 'none'; c.shown = false; c.core = false; c.keep = false; }

    if (queue.length > 1) queue.sort((a, b) => a.pri - b.pri);
    while (inflight < cfg.maxConcurrent && queue.length) start(queue.shift());
    while (inflight < cfg.bgConcurrent && !queue.length && bgQueue.length) {
      const c = bgQueue.pop();
      if (!c.baseLoaded && c.baseLoading !== true) start({ c: c, z: BASE_Z, base: true, pri: 1e9 });

    if (destroyed) return false;
    const c = t.c;
    if (t.base) return useBase && !c.baseLoaded;
    return c.shown && t.z === curZ && c.detailLvl !== t.z;

    const c = t.c, z = t.z;
    if (!t.base && !wanted(t)) return;
    inflight++;
    if (t.base) c.baseLoading = true; else c.loading = z;
    let url = null, revoke = false;
    try {
      const got = await resolve(c, z);
      url = got.url; revoke = !!got.revoke;
      if (!wanted(t)) throw new Error('stale');
      const img = new Image();
      img.decoding = 'async';
      if ('fetchPriority' in img) img.fetchPriority = t.base ? 'low' : 'high';
      img.src = url;
      try { await img.decode(); }
      catch (e) { await new Promise((ok, no) => { img.onload = ok; img.onerror = no; }); }
      if (!wanted(t)) throw new Error('stale');
      attach(c, img, z, t.base, revoke ? url : null);
      url = null;
    } catch (e) {
      if (url && revoke) URL.revokeObjectURL(url);

      else if (c.loading === z) c.loading = -1;

    img._rev = revokeUrl;
    ensureNode(c);
    if (isBase) {
      if (c.baseImg) { c.baseImg.remove(); if (c.baseImg._rev) URL.revokeObjectURL(c.baseImg._rev); }
      c.baseImg = img; c.baseLoaded = true;
      c.wrapper.insertBefore(img, c.wrapper.firstChild);
    } else {
      const old = c.detail;
      c.wrapper.appendChild(img);          
      if (old) { old.remove(); if (old._rev) URL.revokeObjectURL(old._rev); }
      else loadedCount++;
      c.detail = img; c.detailLvl = z;
      live.add(c);
    }
  }
  function dropDetail(c) {
    if (!c.detail) return;
    c.detail.remove();
    if (c.detail._rev) URL.revokeObjectURL(c.detail._rev);
    c.detail.removeAttribute('src');
    c.detail = null; c.detailLvl = -1;
    live.delete(c); loadedCount--;
  }

  function sweep() {
    if (live.size <= cfg.tileBudget) return;
    const s = view.scale;
    const ccx = (-view.x / s + viewer.clientWidth / s / 2) / TW;
    const ccy = (-view.y / s + viewer.clientHeight / s / 2) / TH;
    const arr = [];
    live.forEach(c => { if (!c.core) arr.push(c); });
    arr.sort((a, b) => {
      const da = (a.gx - ccx) ** 2 + (a.gy - ccy) ** 2;
      const db = (b.gx - ccx) ** 2 + (b.gy - ccy) ** 2;
      return db - da;
    });
    for (let i = 0; i < arr.length && live.size > cfg.tileBudget; i++) dropDetail(arr[i]);
  }

  function diagnose(z, shown) {
    if (!diagEl) return;
    const now = performance.now();
    if (now - diagAt < 200) return;
    diagAt = now;
    diagEl.textContent = 'Уровень: ' + z + ' | На экране: ' + shown +
      ' | В памяти: ' + loadedCount + ' | Очередь: ' + (queue.length + inflight) +
      ' | Масштаб: ' + view.scale.toFixed(2);
  }

  function clamp() {
    const vw = viewer.clientWidth, vh = viewer.clientHeight, s = view.scale;
    const w = worldW * s, h = worldH * s;
    const mx = Math.min(vw * 0.5, Math.max(0, (vw - w) / 2) + vw * 0.5);
    const my = Math.min(vh * 0.5, Math.max(0, (vh - h) / 2) + vh * 0.5);
    view.x = Math.min(mx, Math.max(vw - w - mx, view.x));
    view.y = Math.min(my, Math.max(vh - h - my, view.y));
    if (w <= vw) view.x = (vw - w) / 2;
    if (h <= vh) view.y = (vh - h) / 2;
  }
  function zoomAt(mx, my, factor) {
    const ns = Math.min(cfg.maxScale, Math.max(minScale, view.scale * factor));
    if (ns === view.scale) return;
    view.x = mx - (mx - view.x) * (ns / view.scale);
    view.y = my - (my - view.y) * (ns / view.scale);
    view.scale = ns;
    const z = idealLevel();
    if (z !== curZ) { curZ = z; }
    clamp(); apply();
  }
  function fit() {
    const vw = viewer.clientWidth, vh = viewer.clientHeight;
    const s = Math.min(vw / worldW, vh / worldH);
    minScale = s * cfg.minScaleFactor;
    view.scale = s;
    view.x = (vw - worldW * s) / 2;
    view.y = (vh - worldH * s) / 2;
    curZ = idealLevel();
    apply();
  }

  const pts = new Map();
  let pan = null, pinch = null, lastTap = 0;

    viewer.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

      viewer.classList.add('dragging');
      const now = performance.now();
      if (now - lastTap < 300) {
        const rect = viewer.getBoundingClientRect();
        zoomAt(e.clientX - rect.left, e.clientY - rect.top, 2);
        lastTap = 0;
      }
      else lastTap = now;
    } else if (pts.size === 2) {
      pan = null;
      const a = [...pts.values()];
      pinch = {
        d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1,
        cx: (a[0].x + a[1].x) / 2, cy: (a[0].y + a[1].y) / 2,
        s: view.scale, vx: view.x, vy: view.y
      };
    }
  });
  viewer.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size >= 2) {
      const a = [...pts.values()];
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      const cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2;
      const ns = Math.min(cfg.maxScale, Math.max(minScale, pinch.s * (d / pinch.d)));
      const k = ns / pinch.s;
      view.scale = ns;
      const rect = viewer.getBoundingClientRect();
      view.x = (cx - rect.left) - ((pinch.cx - rect.left) - pinch.vx) * k;
      view.y = (cy - rect.top) - ((pinch.cy - rect.top) - pinch.vy) * k;
      const z = idealLevel(); if (z !== curZ) curZ = z;
      clamp(); apply();
    } else if (pan) {
      view.x = pan.vx + (e.clientX - pan.x);
      view.y = pan.vy + (e.clientY - pan.y);
      clamp(); apply();
    }
  });
  function up(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) { pan = null; viewer.classList.remove('dragging'); sweep();
    }
    else { const a = [...pts.entries()][0]; pan = { x: a[1].x, y: a[1].y, vx: view.x, vy: view.y }; }
  }
  viewer.addEventListener('pointerup', up);
  viewer.addEventListener('pointercancel', up);

  viewer.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.ctrlKey
      ? Math.exp(-e.deltaY * 0.01)                       
      : (e.deltaY < 0 ? 1.18 : 1 / 1.18);
    // Пересчет координат курсора относительно рамки (фикс съезжания в планшете/телефоне)
    const rect = viewer.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, f);
  }, { passive: false });

  let rsz = 0;
  const ro = new ResizeObserver(() => {
    if (rsz) clearTimeout(rsz);
    rsz = setTimeout(() => {
      if (destroyed) return;
      const vw = viewer.clientWidth, vh = viewer.clientHeight;
      const s = Math.min(vw / worldW, vh / worldH);
      minScale = s * cfg.minScaleFactor;
      if (view.scale < minScale) { fit(); return; }
      clamp(); apply(); updateVisible();
    }, 100);
  });
  ro.observe(viewer);

  if (useBase) for (let i = chunks.length - 1; i >= 0; i--) bgQueue.push(chunks[i]);
  fit();
  updateVisible();

  return {
    fit: fit,
    zoom: f => zoomAt(viewer.clientWidth / 2, viewer.clientHeight / 2, f),
    destroy() {
      destroyed = true;
      ro.disconnect();
      if (raf) cancelAnimationFrame(raf);
      queue.length = 0; bgQueue.length = 0;
      for (const c of chunks) {
        if (c.detail && c.detail._rev) URL.revokeObjectURL(c.detail._rev);
        if (c.baseImg && c.baseImg._rev) URL.revokeObjectURL(c.baseImg._rev);
        c.detail = null; c.baseImg = null; c.wrapper = null;
        c.detailLvl = -1; c.baseLoaded = false; c.shown = false; c.loading = -1;
      }
      live.clear();
      world.textContent = '';
    }
  };
}
(function(){
  const viewer = document.getElementById('viewer');
  const world  = document.getElementById('world');
  const pager  = document.getElementById('pager-controls');
  const label  = document.getElementById('pager-label');
  const prevB  = document.getElementById('prev-btn');
  const nextB  = document.getElementById('next-btn');

  let engine = null;
  let index = 0;

  function normalize(p) {
    const chunks = p.chunks.map(function(o,i){
      return {
        name: o.n,
        levels: o.p.map(function(path){ return { path: path }; }),
        base: o.n.split('/').map(encodeURIComponent).join('/'),
        gx: i % p.cols, gy: (i / p.cols) | 0,
        detailLvl: -1, loading: -1, baseLoaded: false, shown: false
      };
    });
    return {
      chunks: chunks, cols: p.cols, rows: p.rows,
      tileW: p.tileW, tileH: p.tileH, levelW: p.levelW
    };
  }

  const models = D.panels.map(normalize);

  function open(i) {
    index = i;
    const m = models[i];
    if (engine) { engine.destroy(); engine = null; }
    world.textContent = '';
    engine = createEngine({
      chunks: m.chunks, cols: m.cols, rows: m.rows,
      tileW: m.tileW, tileH: m.tileH, levelW: m.levelW,
      viewer: viewer, world: world, diagEl: null,
      config: { maxConcurrent: 10, bgConcurrent: 4 },
      resolve: function(c, z){
        const lv = c.levels[z] || c.levels[c.levels.length - 1];
        return { url: './' + c.base + '/' + encodeURIComponent(lv.path), revoke: false };
      }
    });
    label.textContent = (index + 1) + ' / ' + models.length;
    prevB.disabled = index <= 0;
    nextB.disabled = index >= models.length - 1;
  }

  prevB.addEventListener('click', function(){ if (index > 0) open(index - 1); });
  nextB.addEventListener('click', function(){ if (index < models.length - 1) open(index + 1); });
  addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'  && index > 0) open(index - 1);
    if (e.key === 'ArrowRight' && index < models.length - 1) open(index + 1);
  });

  if (models.length > 1) pager.style.display = 'flex';
  else pager.style.display = 'none';

  open(0);
})();
</script>
